{% extends "base.html" %}{% block body %}
<div class="panel">
<h2>Confirmation</h2>
<table>
 <tr><td class="c1">New account number</td><td class="c1">{{ new_number }}</td></tr>
 <tr><td class="c1">Member</td><td class="c1">{{ number }} — {{ member.name }}</td></tr>
 <tr><td class="c1">Account type</td><td class="c1">{{ account_type }}</td></tr>
 <tr><td class="c1">Nickname</td><td class="c1">{{ nickname }}</td></tr>
</table>
<p class="c1">The sub-account has been opened.</p>
</div>
{% endblock %}
