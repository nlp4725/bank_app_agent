schema_version: 1
capability:
  id: member.open_sub_account
  version: 1.0.0
  vendor_app: demo-core-servicing
  role: account_opener
  status: draft
  approvals: []
contract:
  inputs:
    member_number:
      type: string
      pattern: ^[0-9]{5}$
      sensitive: true
    account_type:
      type: enum
      values:
      - savings
      - checking
      - holiday
    nickname:
      type: string
      max_length: 20
  outputs:
    savings_balance:
      type: money
    new_account_number:
      type: string
  outcomes:
  - code: MEMBER_NOT_FOUND
    meaning: No member exists with that number.
    resolver: member
    caller_hint: Ask the member to re-check the number.
  - code: NOT_AUTHORIZED
    meaning: This login may not view that member.
    resolver: institution_staff
  - code: VALIDATION_REJECTED
    meaning: The application rejected the values.
    resolver: member
needs:
  pages:
  - /login
  - /members
  - /members/*
  - /search
  actions:
  - click
  - read
  - select
  - type
  secrets:
  - login_password
  - login_username
targets:
  t_user_id:
    rungs:
    - kind: label_anchor
      anchor: User ID
      role: textbox
      relation: right_of
  t_password:
    rungs:
    - kind: label_anchor
      anchor: Password
      role: textbox
      relation: right_of
  t_sign_in:
    rungs:
    - kind: role_name
      role: button
      name: Sign in
    - kind: picture
      asset: artifacts/assets/member.open_sub_account/03_target.png
  t_member_number:
    rungs:
    - kind: label_anchor
      anchor: Member number
      role: textbox
      relation: right_of
  t_member_number_button:
    rungs:
    - kind: label_anchor
      anchor: Member number
      role: button
      relation: right_of
    - kind: picture
      asset: artifacts/assets/member.open_sub_account/05_target.png
  t_ok:
    rungs:
    - kind: role_name
      role: button
      name: OK
    - kind: picture
      asset: artifacts/assets/member.open_sub_account/06_target.png
  t_savings_balance:
    rungs:
    - kind: label_anchor
      anchor: Savings balance
      role: null
      relation: right_of
    frame:
      url_contains: /panel
  t_open:
    rungs:
    - kind: role_name
      role: button
      name: Open
    - kind: picture
      asset: artifacts/assets/member.open_sub_account/08_target.png
  t_account_type:
    rungs:
    - kind: role_name
      role: combobox
      name: 'Savings

        Checking

        Holiday Club'
    - kind: label_anchor
      anchor: Account type
      role: combobox
      relation: right_of
  t_nickname:
    rungs:
    - kind: label_anchor
      anchor: Nickname
      role: textbox
      relation: right_of
  t_review:
    rungs:
    - kind: role_name
      role: button
      name: Review
    - kind: picture
      asset: artifacts/assets/member.open_sub_account/11_target.png
  t_continue:
    rungs:
    - kind: role_name
      role: button
      name: Continue
  t_new_account_number:
    rungs:
    - kind: label_anchor
      anchor: New account number
      role: null
      relation: right_of
states:
- id: s1_login
  checkpoint:
    type: element_present
    target: t_user_id
- id: s2_user_id_entered
  checkpoint:
    type: field_value
    target: t_user_id
    non_empty: true
- id: s3_password_entered
  checkpoint:
    type: field_value
    target: t_password
    non_empty: true
- id: s4_search
  checkpoint:
    type: element_present
    target: t_member_number
- id: s5_member_number_entered
  checkpoint:
    type: field_value
    target: t_member_number
    non_empty: true
- id: s6_members
  checkpoint:
    type: element_present
    target: t_ok
- id: s7_members_id
  checkpoint:
    type: element_present
    target: t_savings_balance
- id: s8_savings_balance_read
  checkpoint:
    type: element_present
    target: t_savings_balance
- id: s9_members_id
  checkpoint:
    type: element_present
    target: t_account_type
- id: s10_account_type_entered
  checkpoint:
    type: field_value
    target: t_account_type
    non_empty: true
- id: s11_nickname_entered
  checkpoint:
    type: field_value
    target: t_nickname
    non_empty: true
- id: s12_members_id
  checkpoint:
    type: element_present
    target: t_continue
- id: s13_members_id
  checkpoint:
    type: element_present
    target: t_new_account_number
- id: s14_new_account_number_read
  checkpoint:
    type: element_present
    target: t_new_account_number
  terminal: succeeded
transitions:
- from_state: s1_login
  to_state: s2_user_id_entered
  action:
    type: type
    target: t_user_id
    value_ref: login_username
  risk: safe
- from_state: s2_user_id_entered
  to_state: s3_password_entered
  action:
    type: type
    target: t_password
    value_ref: login_password
  risk: safe
- from_state: s3_password_entered
  to_state: s4_search
  action:
    type: click
    target: t_sign_in
  risk: consequential
- from_state: s4_search
  to_state: s5_member_number_entered
  action:
    type: type
    target: t_member_number
    value: '{{member_number}}'
  risk: safe
- from_state: s5_member_number_entered
  to_state: s6_members
  action:
    type: click
    target: t_member_number_button
  risk: consequential
- from_state: s6_members
  to_state: s7_members_id
  action:
    type: click
    target: t_ok
  risk: consequential
- from_state: s7_members_id
  to_state: s8_savings_balance_read
  action:
    type: read
    target: t_savings_balance
    into: savings_balance
  risk: safe
- from_state: s8_savings_balance_read
  to_state: s9_members_id
  action:
    type: click
    target: t_open
  risk: consequential
- from_state: s9_members_id
  to_state: s10_account_type_entered
  action:
    type: select
    target: t_account_type
    value: '{{account_type}}'
  risk: safe
- from_state: s10_account_type_entered
  to_state: s11_nickname_entered
  action:
    type: type
    target: t_nickname
    value: '{{nickname}}'
  risk: safe
- from_state: s11_nickname_entered
  to_state: s12_members_id
  action:
    type: click
    target: t_review
  risk: consequential
- from_state: s12_members_id
  to_state: s13_members_id
  action:
    type: click
    target: t_continue
  risk: consequential
- from_state: s13_members_id
  to_state: s14_new_account_number_read
  action:
    type: read
    target: t_new_account_number
    into: new_account_number
  risk: safe
watchers: []
provenance:
  discovered_by: 01-discovery-goal-reached
  contract_by: reviewer
  example_values:
    member_number: '54321'
    account_type: savings
    nickname: Holiday fund
