# What the Reviewer decided about the draft compiled from disc_7ec36ab5, and why.
# Applied mechanically by cua/review.py; nothing here is inferred.
version: 1.0.0
approvals: [reviewer:nasi, reviewer:sam]     # two, because it commits

# Every click arrived Consequential. These are safe: they navigate, they do not commit.
# t_member_number_button is the unlabelled search icon: it shares the anchor
# "Member number" with the field beside it, so the Recorder disambiguated by role.
safe_targets: [t_sign_in, t_member_number_button, t_open, t_review]

# The model clicked OK on a "System notice" that appeared once. That is an
# interruption, not part of the flow: it must not be a step, or replay for a member
# without the notice would fail looking for a button that is not there.
interruptions:
  - target: t_ok
    watcher_id: w_system_notice
    trigger: {type: text_present, value: "System notice"}
    budget: 2
    provenance: disc_7ec36ab5

# Learnt by living through it on a second run, and one added by hand.
watchers:
  - id: w_not_found
    trigger: {type: text_present, value: "No records found"}
    condition: business_outcome
    outcome: MEMBER_NOT_FOUND
    provenance: disc_0a3f513c            # the 99999 run, ended report_outcome
  - id: w_not_authorized
    trigger: {type: text_present, value: "not authorized to view"}
    condition: business_outcome
    outcome: NOT_AUTHORIZED
    provenance: reviewer:nasi            # added by hand, not discovered

# The commit must be checkable without clicking it again.
verify_effects:
  - target: t_continue
    verify_effect:
      goto: "/members/{{member_number}}"
      predicate: {type: text_present, value: "{{nickname}}"}

# VALIDATION_REJECTED is dropped: nothing in this flow can produce it yet, and an
# outcome the caller is promised but can never receive is worse than no outcome.
keep_outcomes: [MEMBER_NOT_FOUND, NOT_AUTHORIZED]
