[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cua"
version = "0.1.0"
description = "Computer-use automation for legacy bank servicing apps: discover once with a model, replay with none"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "playwright>=1.49",
]

[project.optional-dependencies]
discovery = ["anthropic>=0.69"]
demo = ["flask>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
cua-replay = "tools.replay:main"
cua-discover = "tools.discover:main"
cua-start = "tools.start:main"

[tool.setuptools]
packages = ["cua", "cua.domain", "cua.governance", "cua.evidence", "cua.surface",
            "cua.replay", "cua.authoring", "cua.discovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "A", "UP"]
ignore = ["E501"]           # long lines are reviewed by eye; the docstrings carry the reasoning

[tool.ruff.lint.isort]
known-first-party = ["cua", "tools", "fake_bank", "tests"]

[tool.mypy]
python_version = "3.11"
packages = ["cua.domain", "cua.replay"]
strict = false
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E701", "E702", "E741"]     # one-line scripted answers and fixtures read better on one line
